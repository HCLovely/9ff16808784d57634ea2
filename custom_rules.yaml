# 自定义规则：按填写顺序优先于所有上游规则匹配。
# 取消下方示例注释并替换域名后，将 rules: [] 改为 rules:。
# 可用目标：PROXY（面板代理）、DIRECT（直连）、REJECT（拦截），以及生成配置中的策略组名。
# 若填写 MATCH，将提前兜底，后续上游规则不再匹配，请谨慎使用。
# 不支持在此文件定义新策略组或规则集；RULE-SET 只能引用上游已有的规则提供者。
# 本地更新两份配置：python update_rules.py --input sources/Custom_Clash.yaml
# 只读检查：python update_rules.py --input sources/Custom_Clash.yaml --check
# 指定其他文件：python update_rules.py --custom-rules path/to/rules.yaml
# 单独转换同样支持：python convert_clash.py --custom-rules path/to/rules.yaml
# 提交并推送本文件后，会触发 GitHub Actions 更新；后续定时更新也会持续合并。
# 默认文件缺失时不添加规则；指定 --custom-rules 时文件必须存在。
