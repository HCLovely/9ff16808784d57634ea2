name: Update Clash rules

on:
  schedule:
    # UTC 00:23 / 06:23 / 12:23 / 18:23，即北京时间 08:23 / 14:23 / 20:23 / 02:23。
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-rules.yml'
      - 'convert_clash.py'
      - 'update_rules.py'
      - 'requirements.txt'
      - 'sources/Custom_Clash.yaml'

# 只允许更新本仓库内容，不需要额外保存个人访问令牌。
permissions:
  contents: write

concurrency:
  group: update-clash-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download and validate both routing variants
        run: python update_rules.py

      - name: Verify generated files match the saved source
        run: python update_rules.py --input sources/Custom_Clash.yaml --check

      - name: Commit and push changed rules
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git add -- sources/Custom_Clash.yaml Custom_Clash_3xui.yaml Custom_Clash_3xui_inline.yaml
          if git diff --cached --quiet; then
            echo "No source or routing changes; no commit needed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: update upstream Clash routing rules"
          # 并发的外部提交会导致普通推送失败，保留远程内容，不强制覆盖。
          git push origin "HEAD:${DEFAULT_BRANCH}"
